<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות לחשבון</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f6f6f4;
            color: #1f2d1f;
        }

        .page-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-container {
            width: 100%;
            max-width: 560px;
            text-align: center;
        }

        .login-title {
            font-size: 52px;
            font-weight: 700;
            margin: 0 0 10px;
            color: #233223;
        }

        .login-subtitle {
            font-size: 18px;
            color: #8d8578;
            margin-bottom: 40px;
        }

        .form-group {
            text-align: right;
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #233223;
        }

        .form-input {
            width: 100%;
            height: 62px;
            border: 1px solid #d8d4cc;
            border-radius: 18px;
            padding: 0 22px;
            font-size: 18px;
            background-color: #fff;
            outline: none;
        }

        .form-input::placeholder {
            color: #b1a796;
        }

        .form-input:focus {
            border-color: #6a9b5d;
        }

        .remember-row {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            margin: 8px 0 24px;
            font-size: 16px;
            color: #233223;
        }

        .remember-row input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .login-button {
            width: 100%;
            height: 64px;
            border: none;
            border-radius: 18px;
            background-color: #5f9957;
            color: white;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(95, 153, 87, 0.22);
            transition: 0.2s;
        }

        .login-button:hover {
            background-color: #54894d;
        }

        .bottom-text {
            margin-top: 28px;
            font-size: 18px;
            color: #6d6d6d;
        }

        .bottom-text a {
            color: #3f6f38;
            font-weight: 700;
            text-decoration: none;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }
.forgot-bottom-text {
    text-align: center;
    margin-top: 10px;
    font-size: 16px;
}

.forgot-bottom-text a {
    color: #6f8f60;
    text-decoration: none;
    font-weight: 600;
}
.error-message {
    background: #fdecea;
    color: #c65345;
    border: 1px solid #f4b4ad;
    border-radius: 9px;
    padding: 15px;
    text-align: center;
    margin: 20px 0;
    font-weight: bold;
}
.forgot-bottom-text a:hover {
    text-decoration: underline;
}

        .forgot-password-row {
    text-align: left;
    margin-top: 8px;
    margin-bottom: 12px;
    }

.forgot-password-link {
    color: #6f8f60;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
}

.forgot-password-link:hover {
    text-decoration: underline;
}

        .error-message {
            margin-top: 14px;
            color: #b3261e;
            font-size: 15px;
            text-align: right;
        }

        @media (max-width: 640px) {
            .login-title {
                font-size: 38px;
            }

            .form-input,
            .login-button {
                height: 56px;
            }
        }
        
    </style>
</head>
<body>
{% include 'line.html' %}
<div class="page-wrapper">
    <div class="login-container">
        <h1 class="login-title">התחברות לחשבון</h1>
        <div class="login-subtitle">היכנסו והמשיכו את המסע שלכם איתנו</div>

{% if error %}
<div class="error-message">
    {{ error }}
</div>
{% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="email">כתובת אימייל</label>
                <input
                    class="form-input"
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">סיסמה</label>
                <input
                    class="form-input"
                    type="password"
                    id="password"
                    name="password"
                    placeholder="הזינו סיסמה"
                    required
                >
            </div>

        

            <div class="remember-row">
                <input type="checkbox" id="remember_me" name="remember_me">
                <label for="remember_me" style="margin:0; font-weight:400;">זכור אותי</label>
            </div>

            <button class="login-button" type="submit">התחבר ←</button>

            
        </form>

    <div class="bottom-text">
    עדיין אין לך חשבון?
    <a href="/signup">הרשם עכשיו</a>
</div>

<div class="forgot-bottom-text">
    <a href="/forgot-password">שכחת סיסמה?</a>
</div>
    </div>
</div>

</body>
</html>
