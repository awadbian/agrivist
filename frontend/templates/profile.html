<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>ניהול חשבון</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f7f7f5;
            direction: rtl;
        }

      .profile-container {
        padding: 40px 80px;
    }
       .profile-content {
         max-width: 1200px;
    margin: 0 auto;
    display: flex;
    gap: 30px;
    align-items: flex-start;
}

.right-column {
    flex: 1;
    min-width: 760px;
}

        .profile-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .profile-header h1 {
            color: #233d2b;
            margin-bottom: 10px;
        }

        .profile-header p {
            color: #9b9b9b;
        }



        .danger-zone {
    width: 360px;
    border: 1px solid #ffb3b3;
    border-radius: 20px;
    padding: 25px;
    background: #fff;
    height: fit-content;
    box-sizing: border-box;
}

.form-group input,
.form-group textarea {
    width: 100%;
    min-height: 52px;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: #f5f5f5;
    font-size: 16px;
    box-sizing: border-box;
}


        .danger-zone h3 {
            color: #d62839;
            margin-bottom: 10px;
        }

        .danger-zone p {
            color: #999;
            margin-bottom: 25px;
        }

        .danger-btn {
            width: 100%;
            background: #d62839;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            font-size: 16px;
        }

        .profile-card {
            flex: 1;
            background: white;
            border-radius: 20px;
            padding: 30px;
            border: 1px solid #dfe7dd;
        }

        .profile-card h2 {
            margin-bottom: 10px;
            color: #233d2b;
        }

        .profile-card p {
            color: #999;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #233d2b;
        }


        .save-btn {
            background: #7b9c68;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
        }
        .security-card {
    margin-top: 25px;
    background: white;
    border: 1px solid #dfe7dd;
    border-radius: 16px;
    padding: 24px;
    display: flex;
    align-items: center;
    gap: 18px;
}

.security-icon {
    order: 1;
    background: #fdecea;
    color: #d65a3a;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.security-text {
    order: 2;
    flex: 1;
    text-align: right;
}

.security-text h2 {
    margin: 0;
    color: #233d2b;
    font-size: 18px;
}

.security-text p {
    margin: 6px 0 0;
    color: #7f8a7b;
}

.password-btn {
    order: 3;
    text-decoration: none;
    color: #233d2b;
    border: 1px solid #dfe7dd;
    padding: 9px 18px;
    border-radius: 9px;
    background: white;
    font-weight: bold;
}
    </style>
</head>

<body>

    {% include "line.html" %}

    <div class="profile-container">

        <div class="profile-header">
            <h1>ניהול חשבון</h1>
            <p>נהל את הפרטים האישיים וההעדפות שלך</p>
        </div>

        <div class="profile-content">

            <div class="danger-zone">
                <h3>אזור מסוכן</h3>
                <p>פעולות בלתי הפיכות</p>

                <form method="POST" action="/delete-account">
                    <button type="submit" class="danger-btn">
                        מחק חשבון לצמיתות
                    </button>
                </form>
            </div>

            <div class="right-column">

                <form method="POST" action="/profile" class="profile-card">

                    <h2>פרטים אישיים</h2>
                    <p>עדכן את המידע האישי שלך</p>

                    <div class="form-group">
                        <label>שם פרטי</label>
                        <input type="text" name="full_name" value="{{ user.full_name }}">
                    </div>

                    <div class="form-group">
                        <label>אימייל</label>
                        <input type="email" name="email" value="{{ user.email }}">
                    </div>

                    <div class="form-group">
                        <label>טלפון</label>
                        <input type="text" name="phone" value="{{ user.phone or '' }}" placeholder="050-1234567">
                    </div>

                    <div class="form-group">
                        <label>עיר מגורים</label>
                        <input type="text" name="city" value="{{ user.city or '' }}" placeholder="תל אביב">
                    </div>

                    <div class="form-group">
                        <label>קצת על עצמי</label>
                        <textarea name="about" rows="4" placeholder="חובב חקלאות ופלפלים חריפים">{{ user.about or '' }}</textarea>
                    </div>

                    <button type="submit" class="save-btn">
                        שמור שינויים
                    </button>

                </form>

                <div class="security-card">
                    <div class="security-icon">🔒</div>

                    <div class="security-text">
                        <h2>אבטחה וסיסמה</h2>
                        <p>עדכן את סיסמת הכניסה שלך</p>
                    </div>

                    <a href="/forgot-password" class="password-btn">שנה סיסמה 🛡️</a>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
