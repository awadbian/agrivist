{% include 'line.html' %}

<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>שכחתי סיסמה</title>
    <style>
        body {
            direction: rtl;
            font-family: Arial, sans-serif;
            background: #f4f7f2;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 420px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #2f4f2f;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #6f8f60;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5d7a52;
        }

        .error {
            color: #b30000;
            margin-top: 12px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            color: green;
            margin-top: 12px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>שכחתי סיסמה</h2>

        <form method="POST" action="/forgot-password">
            <label for="full_name">שם מלא</label>
            <input type="text" id="full_name" name="full_name" value="{{ form_data.full_name }}" required>

            <label for="email">אימייל</label>
            <input type="email" id="email" name="email" value="{{ form_data.email }}" required>

            <label for="new_password">סיסמה חדשה</label>
            <input type="password" id="new_password" name="new_password" required>

            <label for="confirm_password">אימות סיסמה חדשה</label>
            <input type="password" id="confirm_password" name="confirm_password" required>

            <button type="submit">עדכן סיסמה</button>
        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="success">{{ success }}</div>
        {% endif %}
    </div>
</body>
</html>
